services:
  - type: web
    name: guranda-api
    env: node
    buildCommand: npm install && npx turbo run build --filter=api && cd apps/api && npx prisma db push --skip-generate
    startCommand: cd apps/api && npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SUPABASE_URL
        value: https://iibtgxsegeisfkfqmsgl.supabase.co
      - key: SUPABASE_PUBLISHABLE_KEY
        value: sb_publishable_NnJC48d0atOQcT826tfm8Q_AUzsnUUj
      - key: SUPABASE_SECRET_KEY
        sync: false
