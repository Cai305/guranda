version: '3.8'
services:
  postgres:
    image: postgres:15-alpine
    container_name: mxit2_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mxit_db
    ports:
      - "5433:5432"
    volumes:
      - mxit2_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  # Self-hosted WebRTC media server for LifeOS Live. Dev mode uses
  # LiveKit's well-known local dev credentials (devkey/secret) —
  # fine for localhost-only development, never expose this port
  # range publicly with --dev credentials.
  livekit:
    image: livekit/livekit-server:latest
    container_name: mxit2_livekit
    # --node-ip pins the advertised WebRTC candidate to localhost: the
    # container's auto-detected internal IP (e.g. 172.21.0.3) isn't
    # reachable from outside the Docker network, but Docker Desktop's
    # port publishing makes 127.0.0.1:<port> work from the host.
    command: --dev --bind 0.0.0.0 --node-ip=127.0.0.1
    ports:
      - "7880:7880"   # HTTP + WebSocket signaling
      - "7881:7881"   # TCP fallback for restrictive networks
      - "7882:7882/udp" # WebRTC media (ICE/RTP UDP mux)
    restart: unless-stopped

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: mxit2_n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=UTC
      # Set in the (gitignored) root .env — same value as apps/api/.env's
      # ADMIN_API_KEY. Lets n8n workflows call admin-key-gated API endpoints
      # (e.g. POST /home/briefing/refresh-all) via {{$env.ADMIN_API_KEY}}
      # without the key ever being typed into or stored in a workflow.
      - ADMIN_API_KEY=${ADMIN_API_KEY}
      # n8n blocks $env access in expressions by default — needed for the
      # line above to actually resolve.
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
    volumes:
      - mxit2_n8n_data:/home/node/.n8n
    restart: unless-stopped

volumes:
  mxit2_postgres_data:
  mxit2_n8n_data:
